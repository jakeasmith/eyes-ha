<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eyes</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000000;
    overflow: hidden;
    height: 100%;
  }
  body { cursor: none; }
  body.dev-cursor { cursor: default; }
  /* §4.4: js/projection.js sizes #warp to the content and corner-pins it */
  #warp {
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: 0 0;
  }
  #stage {
    display: block;
    width: 100%;
    height: 100%;
  }
  body.mirror #stage { transform: scaleX(-1); }
  #grid {
    display: none;
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 0 4px #4fe0ff;
    background-image:
      linear-gradient(to right, rgba(79, 224, 255, 0.7) 2px, transparent 2px),
      linear-gradient(to bottom, rgba(79, 224, 255, 0.7) 2px, transparent 2px);
    background-position: center;
  }
  body.calibrate { cursor: default; }
  body.calibrate #grid { display: block; }
  .pin {
    display: none;
    position: fixed;
    z-index: 20;
    width: 36px;
    height: 36px;
    margin: -18px 0 0 -18px;
    border: 3px solid #4fe0ff;
    border-radius: 50%;
    box-sizing: border-box;
    cursor: grab;
    touch-action: none;
  }
  .pin.selected { background: rgba(255, 210, 80, 0.8); border-color: #ffd250; }
  body.calibrate .pin { display: block; }
  #calibrate-hint {
    display: none;
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 15;
    font: 15px/1.7 ui-monospace, monospace;
    color: #4fe0ff;
    background: rgba(0, 0, 0, 0.75);
    padding: 10px 16px;
    white-space: pre;
    pointer-events: none;
  }
  body.calibrate #calibrate-hint { display: block; }
  #help {
    display: none;
    position: fixed;
    left: 14px;
    bottom: 14px;
    z-index: 10;
    font: 12px/1.7 ui-monospace, monospace;
    color: rgba(200, 190, 175, 0.75);
    background: rgba(10, 8, 6, 0.6);
    padding: 8px 12px;
    border-radius: 4px;
    white-space: pre;
  }
  body.help #help { display: block; }
</style>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"
        integrity="sha384-g4NTh/Iv5PPU4xPyhEWqPcwtNXOvdaDI8LLnyYfyNZOjKJeYQyjzQ9X5275eBjpt"
        crossorigin="anonymous" defer></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"
        integrity="sha384-u4uqeACkFcoKl57rBQJHVGDd1pqhW4w8X3WjTu1ZksPdxoLqdt34jpoNkJisE25W"
        crossorigin="anonymous" defer></script>
<!-- Dev-only tools. The page must render fine if these fail to load. -->
<script src="https://cdn.jsdelivr.net/npm/tweakpane@3.1.10/dist/tweakpane.min.js"
        integrity="sha384-uYMPXLUnhfw0j6e3zxNPK3rUYRZ/ix65z2pvk73hNo/p6LEzvdXo5cA3CCBs25az"
        crossorigin="anonymous" defer></script>
<script src="https://cdn.jsdelivr.net/npm/stats.js@0.17.0/build/stats.min.js"
        integrity="sha384-6Bk69P4Sz9X/z+xSnouMa3aujEM8KgF0+RYnGGZOemLXHBlrVuLmyE0N46Ih5MvH"
        crossorigin="anonymous" defer></script>
</head>
<body>
<div id="warp"><canvas id="stage"></canvas><div id="grid"></div></div>

<!-- Library seam (SPEC §19): config → rng → viewport → iris → engine → life → renderer -->
<script src="js/config.js"></script>
<script src="js/rng.js"></script>
<script src="js/viewport.js"></script>
<script src="js/iris.js"></script>
<script src="js/engine.js"></script>
<script src="js/life.js"></script>
<script src="js/renderer.js"></script>
<!-- App side: one-shots + MQTT + projection + dev harness + boot. config.js is a
     gitignored sibling holding broker credentials (§11.1); a 404 here is
     expected and harmless when it hasn't been created. -->
<script src="config.js"></script>
<script src="js/oneshots.js"></script>
<script src="js/net.js"></script>
<script src="js/projection.js"></script>
<script src="js/dev.js"></script>
<script src="js/main.js"></script>
</body>
</html>
